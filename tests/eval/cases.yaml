# M6 评测用例集（规格书 8.1，覆盖集）
#
# 用途：意图路由 / 实体链接 / 检索 Recall@5 / 拒答正确率 的**覆盖集**评测。
# 与 `freeform.yaml`（自由问句泛化集）分开统计，两个数分别上报（需求方 2026-10-15 要求）。
#
# 字段口径：
#   id                       用例编号（跨版本稳定，便于对比历史结果）
#   category                 8.1 的场景分类
#   question                 问句（单轮用例）
#   turns                    多轮用例：按顺序在同一 session 内发问，逐轮断言
#   expected_intent          人工标注的**应有意图**（4.4 封闭枚举取值）
#                             —— 标注依据是「人读这句话会期望系统回答什么」，不是「系统会答什么」
#   expected_entity_ids      人工标注的**应有实体**（图谱规范 ID）；要求全部命中
#   expected_evidence_contains  关键依据片段；命中任一即算 Recall@5 命中
#                             - 图谱侧用关系文本片段（如「克制 铠」，对应 Evidence 的
#                               「{压制者} 克制 {目标}：{理由}」格式）
#                             - 向量侧用**该英雄攻略文本里必然出现的英雄名**（关键依据 = 该英雄的攻略）
#   expect_type              answer / low_confidence / clarify / reject（4.9 三档 + 澄清）
#
# **约束**（规格书 8.2）：不得为了让指标好看而修改本文件的标注或放宽 expect_type。
# 指标不达标就如实记录并归因。

