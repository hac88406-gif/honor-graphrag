        expected_intent: COUNTER_BY
        expected_entity_ids: ["166"]
        expect_type: answer

  - id: M-03
    category: 多轮追问
    # 「怎么打」省略主语：继承实体「貂蝉」后成为「怎么打貂蝉」= 如何应对貂蝉，
    # 只有敌方无我方 -> 槽位不完整 -> 澄清（4.9）。这是省略主语链的正确落点。
    turns:
      - question: "貂蝉怕什么"
        expected_intent: COUNTER_BY
        expected_entity_ids: ["141"]
        expect_type: answer
      - question: "怎么打"
        expected_intent: MATCHUP
        expected_entity_ids: ["141"]
        expect_type: clarify

  - id: M-04
    category: 多轮追问
    # 纯指代链：首轮只给英雄名 -> 澄清；次轮「他克制谁」继承实体 -> COUNTER_OF
    turns:
      - question: "东皇太一"
        expected_intent: ENTITY_UNKNOWN
        expected_entity_ids: ["187"]
        expect_type: clarify
      - question: "他克制谁"
        expected_intent: COUNTER_OF
        expected_entity_ids: ["187"]
        expect_type: answer

