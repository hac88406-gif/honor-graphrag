# M6 评测用例集（规格书 8.1，泛化集 / 自由问句）
#
# 用途：与 `cases.yaml`（覆盖集，按 8.1 场景分布构造）**分开统计**意图路由准确率。
# 需求方 2026-10-15 明确：覆盖集与泛化集两个数必须分开报，且泛化集 ≥60 条。
# 理由：20 条抽样的置信区间约 ±18%，80% 这个数不可用；而覆盖集是「照着关键词表构造」的，
# 在上面刷高准确率没有说服力。泛化集用**真实用户口吻**（口语、倒装、省略、简称、错别字）
# 来测「没被关键词表直接覆盖的问法能不能路由对」。
#
# 字段口径：
#   id               用例编号（跨版本稳定）
#   category         问句风格分类（便于归因：是哪一类口吻在失败）
#   question         问句
#   expected_intent  人工标注的**应有意图**（4.4 封闭枚举）
#                     —— 标注依据是「人读这句话会期望系统回答什么」，不是「系统会答什么」
#   expected_entity_ids  人工标注的**应有实体**（图谱规范 ID）；要求全部命中
#   expect_type      answer / low_confidence / clarify / reject（4.9 三档 + 澄清）
#   note             该条为何这样标（或预期它可能失败的原因），供归因时核对
#
# **约束**（规格书 8.2）：不得为了让指标好看而修改本文件的标注或放宽 expect_type。
# 标注先于运行冻结；跑完若与标注不符，**如实计入错误样例并归因**，不得回头改标注。
#
# **已知会失败的口语形态**（写在这里是为了「提前声明这是被测的已知缺口」，不是事后找补）：
#   - 「谁打得过 X」「我拿谁好打 X」这类**倒装/口语**的「求压制者名单」问法；
#   - 「怎么发育」「怎么抓人」「打野节奏怎么带」这类**不带关键词表词根**的 GAMEPLAY 问法；
#   它们都是真实用户会说的话，失败就是失败，不做规避。
#
# **零提示自然说法准入规则（2026-10-16 · 缺陷 D1 的 L4 交付）**：
#   任何新功能或新意图，评测集必须包含 ≥3 条「第一次使用者的原话」——不带方向词、不带术语、
#   不照抄规格书例句，且**每条必须标注可追溯的真实来源（谁在何时打的，`source` 字段）**；
#   这批用例**不得由实现方自行编写**。
#   为什么：D1 缺陷（「镜的克制关系」被当成英雄未识别）在意图路由 79 个用例、294 个测试全绿时
#   依然漏了过去——因为用例是照「设计过的问法」写的，不是照「使用者第一次会怎么打」写的。
#   规则由 `tests/unit/test_eval_case_policy.py` 强制：零提示类用例必须 ≥3 条且每条带 `source`。
#   注：本文件 2026-10-16 之前的 74 条用例为**历史存量**，未标注来源，不追溯（如实记录，不补造）。

